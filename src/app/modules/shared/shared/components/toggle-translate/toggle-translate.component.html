<div class="language-toggle">
  <ion-button fill="clear" (click)="toggleDropdown()">
    {{ current.toUpperCase() }}
  </ion-button>

  <div *ngIf="showDropdown" class="dropdown">
    <ion-item button (click)="selectLang('en')">English</ion-item>
    <ion-item button (click)="selectLang('es')">Español</ion-item>
  </div>
</div>
